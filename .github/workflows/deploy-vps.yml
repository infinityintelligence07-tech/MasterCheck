name: Deploy MasterCheck VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mastercheck-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (git pull + docker compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_PATH="${{ secrets.VPS_APP_PATH }}"
            cd "$APP_PATH"

            if [ ! -f .env ]; then
              echo "ERROR: falta arquivo .env em $APP_PATH"
              exit 1
            fi

            # Atualiza código (repo já clonado na VPS)
            git fetch --prune origin
            git checkout main
            git pull --ff-only origin main

            docker compose build
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f

            echo "Deploy OK: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
